
name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify npm version
        run: |
          node -e "
            const [major, minor] = process.versions.node.split('.').map(Number);
            if (major < 22 || (major === 22 && minor < 14)) {
              throw new Error('Node.js 22.14+ is required for npm trusted publishing.');
            }
          "
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Verify generator output
        run: npm run verify

      - name: Check package metadata
        run: |
          node -e "
            const pkg = require('./package.json');
            const tag = process.env.GITHUB_REF_NAME;
            const repository = typeof pkg.repository === 'string'
              ? pkg.repository
              : pkg.repository?.url || '';

            const errors = [];

            if (pkg.name !== 'err-create')
              errors.push('Unexpected package name.');

            if (tag !== 'v' + pkg.version)
              errors.push('Git tag does not match package.json version.');

            if (!pkg.bin)
              errors.push('Missing bin entry.');

            if (!/github\.com\/errDev-t\/create(?:\.git)?\/?$/i.test(repository))
              errors.push('Incorrect repository URL.');

            if (errors.length) {
              console.error(errors.join('\n'));
              process.exit(1);
            }
          "

      - name: Publish to npm
        run: npm publish --access public
